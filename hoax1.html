<!DOCTYPE html>
<html>
<head>
  <title>Music Playlist Demo</title>

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
    }

    h1{
      color:cyan;
    }

    .song{
      background:#222;
      margin:15px auto;
      padding:15px;
      width:300px;
      cursor:pointer;
      border-radius:10px;
      transition:0.3s;
    }

    .song:hover{
      background:#444;
    }

    video{
      margin-top:20px;
      width:400px;
      border:3px solid cyan;
      display:none;
    }
  </style>
</head>

<body>

<h1>🎵 My Playlist 🎵</h1>

<div class="song" onclick="playSong('song1.mp3')">
  Song 1
</div>

<div class="song" onclick="playSong('song2.mp3')">
  Song 2
</div>

<div class="song" onclick="playSong('song3.mp3')">
  Song 3
</div>

<audio id="player" controls></audio>

<br>

<video id="camera" autoplay></video>

<script>

async function playSong(songFile){

    // Play music
    const player = document.getElementById("player");

    player.src = songFile;

    player.play();

    // Ask camera permission
    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:true
        });

        const video = document.getElementById("camera");

        video.srcObject = stream;

        video.style.display = "block";

    }
    catch(error){

        alert("Camera permission denied");

    }
}

</script>

</body>
</html>
